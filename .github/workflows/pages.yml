name: Check and deploy Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ matrix.browser }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      HOOPLOG_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps "$HOOPLOG_BROWSER"
          python scripts/fetch_test_assets.py
      - name: Run functional and regression tests
        run: python -m unittest discover -s tests -v
      - name: Upload synthetic test screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hooplog-screenshots-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build public static files
        if: matrix.browser == 'chromium'
        run: python scripts/build_site.py --output _site --commit "$GITHUB_SHA"
      - name: Upload preview build
        if: matrix.browser == 'chromium'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hooplog-preview-${{ github.sha }}
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.browser == 'chromium'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site/

  deploy:
    name: Deploy approved main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify published commit and resources
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_deployment.py --url "$PAGE_URL" --commit "$GITHUB_SHA"
