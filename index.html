ont-weight:750;background:var(--green);color:#17241c;font-size:13px;min-height:43px}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#4e2a2c;color:#ffd5cd}.btn.tiny{padding:8px 10px;min-height:33px;font-size:11px}.btn:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}.input{background:#131d20;color:var(--text);border:1px solid #526363;border-radius:11px;padding:12px;width:100%;font-size:14px;min-width:0}.input::placeholder{color:#758c8c}.field{display:grid;gap:7px}.field label{font-size:12px;color:#b5c6c4}.subnote{font-size:11px;color:#a8bdba;line-height:1.7;margin-top:8px}.folder{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;text-align:left;width:100%;color:var(--text);margin:8px 0}.folder.selected{border-color:#acd767;background:#223327}.folder-info{min-width:0;flex:1}.folder-name{font-size:14px;font-weight:750;overflow-wrap:anywhere}.meter{height:8px;border-radius:9px;background:#374649;overflow:hidden}.meter>div{height:100%;background:var(--green);border-radius:9px;transition:width .2s}.clip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;color:var(--text);margin:8px 0}.clip .ico{background:#334640;padding:12px;border-radius:12px;color:var(--green)}.clip .info{min-width:0;flex:1}.clip .info b{font-size:13px;display:block;overflow-wrap:anywhere}.clip .info small{color:var(--muted);font-size:11px;display:block;margin-top:3px;overflow-wrap:anywhere}.dot{width:8px;height:8px;background:#a0a0a0;border-radius:100%;flex-shrink:0}.dot.ok{background:#b8ed87}.tabs{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:760px;background:#151f22ed;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:3px;z-index:10}.tab{background:transparent;border:0;color:#91a6a5;font-size:12px;padding:8px 3px}.tab[aria-selected=true]{color:var(--green);font-weight:800}.tab i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.alert{border-radius:12px;padding:11px 12px;border:1px solid #5d6145;background:#302f24;color:#e7e1b0;font-size:12px;line-height:1.6;margin:11px 0}.alert.danger{border-color:#684449;background:#3c292d;color:#ffd3c9}.alert.good{border-color:#385c45;background:#263d2e;color:#c4e9c5}.empty{text-align:center;padding:25px 12px;color:var(--muted);font-size:13px;line-height:1.7}.progress{font-size:12px;color:#c0d4bd;min-height:18px;line-height:1.6}.divider{border:0;border-top:1px solid var(--line);margin:15px 0}.shot{margin:12px 0}.shot b{font-size:13px}.shot small{font-size:11px;color:var(--muted)}.filters{display:flex;gap:8px;overflow-x:auto;padding:5px 0 12px}.filter{white-space:nowrap;background:var(--panel2);color:#d7e4e0;border:1px solid var(--line);padding:8px 12px;border-radius:20px;font-size:12px}.filter.active{background:var(--green);color:#19301b}.player{position:fixed;inset:0;background:#050b0af5;z-index:40;padding:calc(15px + env(safe-area-inset-top)) 15px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:13px;overflow-y:auto}.player video{width:100%;max-height:56vh;background:black;border-radius:15px}.player h2{margin:0}.player .notes{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e2929;border-radius:12px;padding:12px;color:#dce5df;font-size:13px}input[type=checkbox]{accent-color:#a9d86a;transform:scale(1.2);margin-right:9px}label.check{display:flex;gap:7px;align-items:start;font-size:12px;line-height:1.5;color:#dce6dd}.hide{display:none!important}.tinyrow{font-size:12px;color:#b9cfca;line-height:1.65}.chip{display:inline-block;border:1px solid #445455;border-radius:9px;padding:5px 8px;color:#bfd2cb;font-size:11px}.warning-text{color:#ffc1aa}#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border-radius:12px;background:#e1f8ac;color:#1e301e;padding:11px 15px;z-index:50;font-size:13px;box-shadow:0 4px 25px #0006;max-width:92vw;min-width:180px;text-align:center;display:none}

.compare-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.compare-chip{border:1px solid #d8e0e8;background:#f4f7fa;color:#263449;padding:10px 17px;border-radius:999px;font-weight:700;font-size:14px}.compare-chip.active{background:#245fc7;color:white;border-color:#245fc7}.compare-picks{display:grid;gap:8px;margin:12px 0}.compare-choice{display:flex;gap:9px;align-items:center;padding:12px;border:1px solid #e0e6ed;border-radius:12px;font-size:14px}.compare-choice input{width:19px;height:19px;accent-color:#245fc7}.compare-choice span{flex:1;font-weight:650}.compare-choice small{color:#718096}.compare-item{padding:12px 0;border-bottom:1px solid #edf0f4}.compare-item:last-child{border-bottom:0}.compare-track{height:10px;background:#edf0f4;border-radius:20px;overflow:hidden;margin-top:9px}.compare-track>div{height:100%;border-radius:20px}.compare-item .row{gap:8px;font-size:13px}.compare-item .row span{overflow-wrap:anywhere}

/* v10.1: four always-visible comparison charts (方案一). */
.compare-metric{margin:12px 0 14px;padding:15px 16px 9px}
.compare-metric h3{font-size:16px;margin:0 0 9px;color:var(--text)}
.compare-metric .compare-item{padding:12px 0 15px}
.compare-metric .compare-item:last-child{padding-bottom:7px}
.compare-metric .compare-item .row{align-items:center;gap:12px}
.compare-session{display:flex;align-items:center;gap:9px;min-width:0;word-break:break-word;line-height:1.4}
.compare-legend{display:inline-block;flex:0 0 9px;width:9px;height:9px;border-radius:50%}
.compare-metric .compare-item b{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.compare-metric .compare-track{height:10px;margin-top:9px;background:#e7eaee}
.compare-metric .compare-track>div{transition:width .2s ease}

/* v10.2: 四项逐场变化清晰分行，适配 iPhone 窄屏。 */
.stat-trend{margin:0;padding:16px 0;border-bottom:1px solid var(--line)}
.stat-trend:last-child{border-bottom:0;padding-bottom:2px}
.stat-trend:first-child{padding-top:0}
.stat-trend h3{font-size:14px;margin:0 0 12px;line-height:1.5;overflow-wrap:anywhere}
.stat-trend-row{padding:6px 0;min-width:0}
.stat-trend-row>span{min-width:0;line-height:1.45}
.stat-trend-row small{font-size:12px;color:var(--muted)}
.stat-trend-label{display:inline-block;min-width:42px;font-size:12px;font-weight:650}
.stat-trend-row b{flex-shrink:0;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:350px){.stat-trend-row small{font-size:11px}.stat-trend-row b{font-size:12px}}

/* HOOPLOG v11: 只把统计视图改为清爽的白色，高密度且支持横向滚动。 */
body.stats-v11-theme{color-scheme:light;--bg:#f7f9fc;--panel:#fff;--panel2:#f2f5f9;--line:#e2e8f0;--muted:#718096;--text:#182333;--green:#2969c9;background:var(--bg)}
body.stats-v11-theme .tabs{background:#ffffffed;border-color:var(--line)}
body.stats-v11-theme .tab{color:#718096}
body.stats-v11-theme .tab[aria-selected=true]{color:#2468c8}
body.stats-v11-theme .brand span{color:white}
body.stats-v11-theme .alert{background:#f3f6f9;border-color:#dce4ec;color:#4b5b6a}
body.stats-v11-theme .hero{background:linear-gradient(120deg,#eef4ff,#e5efff);border-color:#d5e4fa;color:#182333}
body.stats-v11-theme .score{color:#2468c8}
body.stats-v11-theme .pill.ok{color:#166245;background:#def7e8}
body.stats-v11-theme .meter{background:#e5ecf4}
body.stats-v11-theme .compare-choice{background:white;color:#182333}
body.stats-v11-theme .compare-chip{background:white;color:#3a495e;border-color:#dce4ef}
body.stats-v11-theme .compare-chip.active{background:#2568cb;color:#fff;border-color:#2568cb}
body.stats-v11-theme .compare-tabs{gap:8px;margin:15px 0 13px}
body.stats-v11-theme .compare-chip{flex:1;text-align:center;padding:10px}
body.stats-v11-theme .compare-choice input{accent-color:#2568cb}
body.stats-v11-theme .compare-choice small{white-space:nowrap}
body.stats-v11-theme .v11-picker{padding:12px 13px;margin:10px 0 14px}
body.stats-v11-theme .compare-picks{gap:5px;margin:10px 0}
body.stats-v11-theme .compare-choice{padding:8px 10px;border-radius:10px}
.v11-pick-actions{display:flex;gap:9px}
.v11-action-link{border:none;background:transparent;color:#2468c8;font-size:12px;font-weight:700;padding:5px 2px}
.v11-score-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:11px 2px 14px;margin-bottom:12px}
.v11-score-label{font-size:12px;color:var(--muted);flex-shrink:0}
.v11-score-sequence{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.v11-score-sequence i{font-style:normal;color:#9ba7b5;font-size:12px;font-weight:400}
.v11-score-delta{margin-left:auto;color:#52647a;font-size:12px;font-weight:650;white-space:nowrap}
.v11-action-card,.v11-change-card{background:#fff;border:1px solid #e0e7ef;border-radius:15px;margin:10px 0;padding:12px 13px}
.v11-action-card h3{display:flex;align-items:center;gap:9px;color:#182333;font-size:15px;margin:0 0 8px}
.v11-action-icon{background:#e9f1fe;color:#2b6fcb;width:27px;height:27px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.v11-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.v11-action-table{border-collapse:collapse;width:100%;table-layout:fixed;color:#233147;line-height:1.4}
.v11-action-table th,.v11-action-table td{padding:8px 4px;border-bottom:1px solid #eef2f6;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.v11-action-table thead th{color:#596d84;font-size:12px;font-weight:650}
.v11-action-table th:first-child{text-align:left;width:29%}
.v11-action-table tbody th{font-weight:500;color:#546579}
.v11-action-table tbody tr:last-child th,.v11-action-table tbody tr:last-child td{border-bottom:0}
.v11-action-table .v11-rate-row th,.v11-action-table .v11-rate-row td{font-weight:800;color:#1e3558}
.v11-section-title{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin:23px 0 10px;color:#182333}
.v11-section-title small{font-size:11px;font-weight:400;color:#728198}
.v11-change-card{padding:13px 14px;margin:10px 0}
.v11-change-card>h3{font-size:15px;margin:0 0 12px;color:#1c2d42}
.v11-change-card>h3 span{color:#8d9bab;padding:0 5px}
.v11-change-score{display:flex;justify-content:space-between;align-items:center;background:#f1f5f9;padding:11px;border-radius:9px;gap:8px;font-size:13px;color:#273951}
.v11-change-score em{font-style:normal;font-variant-numeric:tabular-nums;margin-left:6px}
.v11-change-score b{white-space:nowrap;font-variant-numeric:tabular-nums}
.v11-change-action{padding:14px 2px 10px;border-bottom:1px solid #edf1f5}
.v11-change-action:last-child{border-bottom:0;padding-bottom:2px}
.v11-change-action h4{font-size:13px;margin:0 0 8px;color:#24364b}
.v11-change-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;color:#4d6074;font-size:12px}
.v11-change-line>span{min-width:0;line-height:1.5}
.v11-change-line>span>small{display:block;font-size:11px;color:#7b8798}
.v11-change-line>span>span{display:block;font-size:12px;color:#24364b}
.v11-change-line b{flex-shrink:0;color:#24364b;white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums}
.v11-footer-hint,.v11-hint{color:var(--muted);font-size:11px;line-height:1.7;margin:15px 0}
@media(max-width:365px){.v11-change-line b{font-size:11px}.v11-action-table th,.v11-action-table td{padding:7px 3px;font-size:12px}.v11-change-card{padding:11px}.v11-score-sequence{font-size:14px}}

/* v12: small automatic weekday comparison selector; retains v11 action/score/change panels. */
body.stats-v11-theme .v12-picker{padding:11px 12px;margin:10px 0 12px}
.v12-picker-header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.v12-picker-label{font-size:13px;font-weight:800;color:#1d3555}
.v12-picker-info{font-size:11px;color:#687c90;line-height:1.55;margin-top:2px;overflow-wrap:anywhere}
.v12-edit-button{border:1px solid #d9e4f0;background:#f4f8fe;color:#2369b9;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.v12-chipline{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.v12-chip{background:#eaf1fc;color:#2e568a;padding:4px 8px;border-radius:7px;font-size:11px;font-weight:750;font-variant-numeric:tabular-nums}
.v12-picker-expanded{border-top:1px solid #e9eef4;margin-top:12px;padding-top:10px}
.v12-picker-expanded .compare-picks{max-height:310px;overflow-y:auto;overscroll-behavior:contain;margin:0 0 10px}
.v12-picker-buttons{display:flex;gap:7px;flex-wrap:wrap}
.v12-picker-buttons button{background:#f0f5fb;border:1px solid #d9e4f0;border-radius:8px;padding:8px 10px;color:#32649a;font-size:11px;font-weight:750}

/* HOOPLOG v13: compact, foldable comparison with baseline-aware straight arrows. */
body.stats-v13-focus header{display:none}
body.stats-v13-focus main{padding-top:calc(12px + env(safe-area-inset-top));padding-left:12px;padding-right:12px}
body.stats-v13-focus .v11-footer-hint{margin:9px 3px 5px}
.v13-head{width:100%;border:1px solid #dce6f3;border-radius:13px;padding:11px 12px;background:#fff;color:#182f4e;text-align:left;display:flex;align-items:center;gap:9px;margin:1px 0 10px;min-height:50px}
.v13-head-icon{color:#276dce;font-size:18px;flex-shrink:0}
.v13-head-body{min-width:0;flex:1}
.v13-head-title{font-size:14px;line-height:1.35;font-weight:800;display:block}
.v13-head-meta{font-size:11px;color:#77879b;line-height:1.45;display:block;overflow-wrap:anywhere}
.v13-head-chevron{font-size:18px;color:#2567c5;flex-shrink:0}
.v13-settings{border:1px solid #dce6f3;background:#fff;border-radius:14px;padding:11px 12px;margin:0 0 10px}
.v13-settings .title{font-size:19px;margin:2px 0 4px}.v13-settings .compare-tabs{margin:10px 0 8px}
.v13-settings .v12-picker{border:0;border-top:1px solid #e3eaf3;border-radius:0;box-shadow:none;margin:8px 0 0;padding:11px 0 0}
.v13-settings .v12-picker .v12-chipline{margin-top:8px}
.v13-score{background:#fff;border:1px solid #e1e8f2;border-radius:17px;padding:12px 13px;margin:0 0 10px}
.v13-line-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:9px}
.v13-label{font-weight:800;color:#1e3554;font-size:14px}
.v13-line-sub{font-size:11px;color:#8a98ab;font-weight:500}
.v13-sequence{display:flex;align-items:center;justify-content:space-between;gap:2px;width:100%;min-width:0}
.v13-value{flex:0 1 auto;min-width:0;text-align:center;overflow:hidden}
.v13-date{color:#7e8da2;font-size:11px;line-height:1.25;white-space:nowrap}
.v13-figure{font-size:clamp(19px,6.8vw,34px);font-weight:850;color:#1b304c;font-variant-numeric:tabular-nums;letter-spacing:-.7px;white-space:nowrap;line-height:1.24}
.v13-score .v13-figure{font-size:clamp(27px,8.5vw,40px)}
.v13-sequence.v13-4 .v13-figure{font-size:clamp(18px,5.2vw,25px)}
.v13-sequence.v13-4 .v13-arrow-number{font-size:10px}
.v13-sequence.v13-4 .v13-arrow-svg{height:28px}
.v13-arrow{display:flex;flex:1 1 10px;min-width:22px;align-items:center;flex-direction:column;gap:0;color:var(--arrow-color);line-height:1.1}
.v13-arrow-svg{display:block;width:100%;height:36px;max-width:88px;overflow:visible}
.v13-arrow-number{font-size:11px;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.3px;color:var(--arrow-color);text-align:center}
.v13-action{padding:12px 13px 10px;background:#fff;border:1px solid #e1e8f2;border-radius:17px;margin-bottom:10px}
.v13-action-title{display:flex;align-items:center;gap:8px;color:#192f4c;font-size:17px;font-weight:850;margin-bottom:4px}
.v13-action-symbol{background:#eaf1fd;color:#286bc3;display:grid;place-items:center;border-radius:8px;font-size:16px;width:28px;height:28px;flex-shrink:0}
.v13-metric{padding:7px 0 8px;border-top:1px solid #edf1f6}
.v13-metric:first-of-type{border-top:0}
.v13-metric-title{color:#596c84;font-size:12px;font-weight:650;margin-bottom:4px}
.v13-metric.v13-made .v13-metric-title,.v13-metric.v13-made .v13-seq-value{color:#e53935;font-size:14px}
.v13-action .v13-figure{font-size:clamp(17px,5.7vw,26px)}
.v13-action .v13-sequence.v13-4 .v13-figure{font-size:clamp(15px,4.7vw,21px)}
.v13-rate .v13-figure{color:#18375f;font-weight:900}
.v13-no-data{padding:15px 8px;color:#718096;font-size:13px;text-align:center;background:#fff;border:1px solid #e1e8f2;border-radius:13px}
.v13-footnote{font-size:11px;line-height:1.5;color:#8290a1;margin:3px 3px 0}
@media(max-width:370px){.v13-value .v13-date{font-size:10px}.v13-arrow-number{font-size:10px}.v13-action,.v13-score{padding-left:9px;padding-right:9px}.v13-action .v13-figure{font-size:19px}}

<script>
/* HOOPLOG: Github Pages 静态单页应用。所有视频都写入当前设备 IndexedDB，不上传至 Github。 */
(()=>{'use strict';
const $=q=>document.querySelector(q), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>{n=Number(n||0);return n>=1073741824?(n/1073741824).toFixed(2)+' GB':n>=1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(1)+' KB'};
const safeId=s=>String(s??'').trim(); const vidExt=/\.(mp4|m4v|mov|webm)$/i, sheetExt=/\.(xlsx|xls|csv)$/i;
const state={tab:'folders',folders:[],folderId:null,filter:'全部',token:null,tokenExpiry:0,downloading:false,controller:null,stop:false,stats:[],playerUrl:null,statsMode:'compare',statsSelected:[],statsAction:'原地投篮',statsSelectionCustom:false,statsPickerOpen:false,v13ChromeOpen:false};
let db;let toastTimer;
const toast=(msg)=>{const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',3500)};
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('hooplog-offline-v1',2);req.onupgradeneeded=()=>{let d=req.result; if(!d.objectStoreNames.contains('folders'))d.createObjectStore('folders',{keyPath:'id'});if(!d.objectStoreNames.contains('adventure_media'))d.createObjectStore('adventure_media',{keyPath:'id'});if(!d.objectStoreNames.contains('videos')){let v=d.createObjectStore('videos',{keyPath:'id'});v.createIndex('folderId','folderId',{unique:false})}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
const idbGet=(store,key)=>new Promise((resolve,reject)=>{let req=db.transaction(store,'readonly').objectStore(store).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
const idbAll=store=>new Promise((resolve,reject)=>{let req=db.transaction(store,'readonly').objectStore(store).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
const idbPut=(store,val)=>new Promise((resolve,reject)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('写入缓存失败'))});
const idbDelete=(store,key)=>new Promise((resolve,reject)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
const current=()=>state.folders.find(f=>f.id===state.folderId);

function v11Date(name){

// v12 自动对比：按实际日期辨认最新一场训练，再自动选择这一天所在星期的最近 4 场。
// 日期来自文件夹名前缀（如 1028、20261028、2026-10-28），绝不根据“周三”字样或固定星期表猜测。
function v12TodayTokyo(){
 const date=new Date(Date.now()+9*3600000);

}
function v12DateInfo(name){
 const raw=String(name||'').normalize('NFKC').trim();
 let match=raw.match(/^(20\d{2})[-/.年]?(\d{1,2})[-/.月]?(\d{1,2})(?!\d)/);
 let year,month,day;
 if(match){year=Number(match[1]);month=Number(match[2]);day=Number(match[3]);}
 else{
  match=raw.match(/^(\d{1,2})[-/.月]?(\d{1,2})(?!\d)/);
  if(!match)return null;
  month=Number(match[1]);day=Number(match[2]);
  year=v12TodayTokyo().year;
 }
 if(month<1||month>12||day<1||day>31)return null;
 let stamp=Date.UTC(year,month-1,day),dt=new Date(stamp);
 if(dt.getUTCFullYear()!==year||dt.getUTCMonth()+1!==month||dt.getUTCDate()!==day)return null;
 const today=v12TodayTokyo();
 if(!raw.match(/^20\d{2}/)&&stamp>today.stamp){
  // 无年份的 12 月记录在次年 1 月仍应识别为上一年；不把它当未来训练。
  year--;stamp=Date.UTC(year,month-1,day);dt=new Date(stamp);
  if(dt.getUTCFullYear()!==year||dt.getUTCMonth()+1!==month||dt.getUTCDate()!==day)return null;
 }
 if(stamp>today.stamp)return null;
 return {stamp,weekday:dt.getUTCDay(),year,month,day};
}

function v13Angle(a,b,kind,metric){
 if(!Number.isFinite(a)||!Number.isFinite(b)||a===b)return 0;

function v13Value(group,kind,metric){

function v13ArrowSVG(from,to,kind,metric){
 if(!Number.isFinite(from)||!Number.isFinite(to))return `<span class="v13-arrow" style="--arrow-color:#96a2b0"><span class="v13-arrow-number">—</span></span>`;

  else body+=`<div class="hero"><div class="muted">所选 ${groups.length} 场 · 合计得分</div><div class="score">${total.points}<small> PTS</small></div><div class="row"><span>出手 ${total.total} · 命中 ${total.made}</span><span class="pill ok">${statRate(total.made,total.total)}</span></div></div><div class="grid3">${summaryCard('视频总数',groups.reduce((n,g)=>n+vfiles(g.f).length,0))}${summaryCard('动作记录',total.recorded)}${summaryCard('已缓存',groups.reduce((n,g)=>n+(g.f.cached||0),0))}</div><h2>动作汇总</h2><div class="panel">${stats(all[0]).cats.map(c=>{let made=groups.reduce((n,g)=>n+(g.s.cats.find(x=>x.name===c.name)?.made||0),0),shots=groups.reduce((n,g)=>n+(g.s.cats.find(x=>x.name===c.name)?.total||0),0);return `<div class="shot"><div class="row"><b>${esc(c.name)}</b><b>${statRate(made,shots)}</b></div><small>${made} 中 / ${shots} 投</small></div>`}).join('')}</div>`;
 }

function train14Query(id){return document.getElementById(id)}
function train14Text(id,value){const el=train14Query(id);if(el)el.textContent=value}
function train14Attr(id,key,value){const el=train14Query(id);if(el)el.setAttribute(key,value)}
function train14Arrow(dir){
 const el=train14Query('train14-big');if(!el)return;
 if(!dir){el.style.color='#52708e';el.textContent='读防守！';return}
 el.style.color=dir==='left'?'#246bc7':'#148e68';
 const arrow=dir==='left'?'<svg viewBox="0 0 70 70" fill="none" aria-hidden="true"><path d="M61 37H10M10 37l24-23M10 37l24 23" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>':'<svg viewBox="0 0 70 70" fill="none" aria-hidden="true"><path d="M9 37h51M60 37L36 14M60 37L36 60" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 el.innerHTML=dir==='left'?arrow+'<span>向左突破</span>':'<span>向右突破</span>'+arrow;
}
function train14SetNeutral(){
 train14.phase='neutral';
 train14Attr('train14-foot-l','cy','207');train14Attr('train14-foot-r','cy','207');
 train14Attr('train14-leg-l','y2','207');train14Attr('train14-leg-r','y2','207');
 const body=train14Query('train14-body');if(body)body.style.transform='translateX(0)';
 train14Attr('train14-help-l','opacity','0');train14Attr('train14-help-r','opacity','0');
 train14Attr('train14-help-l','transform','translate(-35 0)');train14Attr('train14-help-r','transform','translate(35 0)');
 train14Attr('train14-lane-l','opacity','0');train14Attr('train14-lane-r','opacity','0');
 train14Text('train14-mini','继续原地运球 · 观察防守');
 train14Text('train14-note','下一次站位变化即将出现');
 const big=train14Query('train14-big');if(big){big.style.color='#52708e';big.textContent='准备观察'}
}
function train14SetScene(reveal){
 const c=train14.scene;if(!c)return;
 const leftY=train14.mode==='direct'?'207':c.lead==='left'?'228':'198',rightY=train14.mode==='direct'?'207':c.lead==='right'?'228':'198';
 train14Attr('train14-foot-l','cy',leftY);train14Attr('train14-foot-r','cy',rightY);
 train14Attr('train14-leg-l','y2',leftY);train14Attr('train14-leg-r','y2',rightY);
 const body=train14Query('train14-body');if(body)body.style.transform=train14.mode==='direct'?'translateX(0)':`translateX(${c.lead==='left'?'-9px':'9px'})`;
 for(const side of ['left','right']){
  const short=side==='left'?'l':'r',show=train14.mode==='help'&&c.help===side;
  train14Attr('train14-help-'+short,'opacity',show?'1':'0');
  train14Attr('train14-help-'+short,'transform',show?'translate(0 0)':`translate(${side==='left'?-35:35} 0)`);
 }
 const visible=train14.mode==='direct'||!train14.hideArrow||reveal;
 if(visible){
  train14Arrow(c.target);
  train14Attr('train14-lane-'+(c.target==='left'?'l':'r'),'opacity','0.8');
  train14Attr('train14-lane-'+(c.target==='left'?'r':'l'),'opacity','0');
 }else{train14Arrow(null);train14Attr('train14-lane-l','opacity','0');train14Attr('train14-lane-r','opacity','0')}
 train14Text('train14-mini',train14.mode==='direct'?'看到方向立即移动':train14.mode==='foot'?'前脚突然变化！立即启动':'前脚 + 协防变化！立即判断');
 train14Text('train14-note',train14.mode==='help'?'内线被封的一侧，优先绕开':'看前脚，实际完成一次突破起步');
}
function train14Choose(){
 // 每回合独立随机：目标方向向右 60%，向左 40%；允许连续同向，不人为削减右侧概率。
 const target=Math.random()<0.6?'right':'left';
 let lead=target,help='none';
 if(train14.mode==='help'&&Math.random()<.5){
  // 协防封住目标的另一侧；约一半题目要求读协防，另一半只判断前脚。
  help=target==='right'?'left':'right';
  lead=Math.random()<.5?target:(target==='right'?'left':'right');
 }
 return {lead,help,target};
}
function train14Cue(){
 train14.round++;
 train14.scene=train14Choose();train14.phase='cue';
 if(train14.scene.target==='left')train14.left++;else train14.right++;
 train14Text('train14-round',String(train14.round));
 train14Text('train14-left-count',String(train14.left));train14Text('train14-right-count',String(train14.right));
 train14Text('train14-round-label',`第 ${train14.round} 回合`);
 train14Text('train14-status','训练中');
 train14SetScene(false);
}
function train14Tick(force=false){
 if(!train14.running||state.tab!=='training'||train14.view!=='practice')return;
 const elapsed=performance.now()-train14.started;
 if(elapsed<2100){
  train14Text('train14-mini','准备站位 · 稳定运球');
  train14Text('train14-note','倒数后开始自动变换');
  const big=train14Query('train14-big');if(big){big.style.color='#52708e';big.textContent=String(Math.max(1,Math.ceil((2100-elapsed)/700)))}
  train14Attr('train14-bar','style',`width:${(elapsed/2100*100).toFixed(2)}%`);
  if(force)train14SetNeutral();return;
 }
 const e=elapsed-2100,idx=Math.floor(e/train14.period),pos=e%train14.period;
 if(idx!==train14.cycle){train14.cycle=idx;train14Cue()}
 const activeTime=train14.period-850;
 if(pos>=activeTime){if(train14.phase!=='neutral'||force){train14SetNeutral();train14Text('train14-round-label','继续运球')}}
 else if(force||train14.phase!=='cue'){train14.phase='cue';train14SetScene(pos>=activeTime-850)}
 else if(train14.hideArrow&&train14.mode!=='direct'&&pos>=activeTime-850)train14SetScene(true);
 train14Attr('train14-bar','style',`width:${(pos/train14.period*100).toFixed(2)}%`);
}
function train14Start(){
 if(train14.running)return;
 train14.running=true;train14.round=0;train14.left=0;train14.right=0;
 train14.cycle=-1;train14.phase='idle';train14.scene=null;train14.lastDir='';train14.sameDirection=0;
 train14.started=performance.now();train14.startedAt=Date.now();
 render();train14SetNeutral();
 clearInterval(train14Timer);train14Timer=setInterval(()=>train14Tick(),70);train14Tick();
}
function train14Stop(redraw=true){
 if(train14Timer){clearInterval(train14Timer);train14Timer=null}
 if(train14.running)train14LogSession();
 train14.running=false;train14.phase='idle';train14.scene=null;
 if(redraw&&state.tab==='training'){
  render();train14Text('train14-status','已暂停');train14Text('train14-mini','训练已停止');
  train14Text('train14-note','可调整模式或速度后重新开始');
  const big=train14Query('train14-big');if(big){big.style.color='#52708e';big.textContent='完成'}
 }
}
function train14OnMount(){
 if(train14.view!=='practice')return;
 train14SetNeutral();
 if(train14.running){train14Tick(true)}
}

function videoRecords(folder,video){const key=normalizeName(video.name);return (folder?.records||[]).filter(r=>normalizeName(r.clip)===key)}
function actionGroup(action){const a=String(action||'').trim();if(!a)return '未分类';if(/失误|无效运球|违例/.test(a))return '失误/其他';if(/突破/.test(a))return '突破类';if(/投篮|跳投|三分|中投|远投/.test(a))return '投篮类';if(/上篮|篮下|补篮|终结|扣篮/.test(a))return '篮下终结类';if(/传球|助攻/.test(a))return '传球类';if(/防守|抢断|盖帽|篮板/.test(a))return '防守/篮板类';return '其他动作'}
function clipGroups(folder,video){const rows=videoRecords(folder,video);return rows.length?[...new Set(rows.flatMap(r=>r.action==='篮下反篮'?['篮下反篮',actionGroup(r.action)]:[actionGroup(r.action)]))]:['未分类']}
function clipsPage(){let f=current();if(!f)return nav('视频片段','本机已缓存才允许播放')+'<div class="empty">先选择一个子文件夹</div>';let all=vfiles(f);const options=['全部','投篮类','突破类','篮下终结类','篮下反篮','传球类','防守/篮板类','失误/其他','其他动作','未分类','已缓存','未缓存','命中','未中'];let rows=all.filter(x=>{let rr=videoRecords(f,x);return state.filter==='全部'||state.filter==='已缓存'&&x.cached||state.filter==='未缓存'&&!x.cached||state.filter==='命中'&&rr.some(r=>r.result==='成功')||state.filter==='未中'&&rr.some(r=>r.result==='失败')||clipGroups(f,x).includes(state.filter)});return nav('视频片段',esc(f.name)+' · 根据 Excel 动作自动分类 · 离线播放')+`<div class="filters">${options.map(x=>`<button class="filter ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="tinyrow">${rows.length} 个视频 · 一个视频可以同时属于多个类别 · 未缓存不联网播放</div>${rows.map(v=>{let rr=videoRecords(f,v);let labels=rr.map(r=>[canonicalShotAction(r.action)||'未分类',r.result,r.note].filter(Boolean).join(' · '));return `<button class="clip" data-play="${esc(v.id)}"><span class="ico">▶</span><span class="info"><b>${esc(v.name)}</b><small>${esc(clipGroups(f,v).join(' / '))}</small><small>${esc(labels.join('；').slice(0,160)||'没有动作记录')}</small></span><span class="pill ${v.cached?'ok':'warn'}">${v.cached?'已离线':'未缓存'}</span></button>`}).join('')||'<div class="empty">没有符合条件的片段</div>'}`;}
function settingsPage(){let id=localStorage.getItem('hooplog_client_id')||'',root=localStorage.getItem('hooplog_root_url')||'';return nav('网站设置','一次配置后，下次直接用你的 Google Drive')+`<div class="panel stack"><h3>Google Drive 授权</h3><div class="field"><label for="clientId">Google Cloud 网页 OAuth 客户端 ID（不是密钥）</label><input class="input" id="clientId" value="${esc(id)}" placeholder="xxxxxxxx.apps.googleusercontent.com" autocapitalize="off"></div><div class="row wrap"><button class="btn" id="saveClient">保存客户端 ID</button><button class="btn secondary" id="googleLogin">使用 Google 登录</button><button class="btn secondary" id="signout">退出本次登录</button></div><div class="tinyrow" id="authState">${state.token&&Date.now()<state.tokenExpiry?'● 已获取授权':'○ 尚未登录或授权已过期'}</div><div class="subnote">授权只在当前网页运行期间使用；不保存访问令牌。第一次使用需在 Google Cloud 启用 Drive API，并把 GitHub Pages 域名加入 OAuth 授权来源。</div></div><div class="panel stack"><h3>Google Drive · 篮球总文件夹</h3><div class="field"><label for="folderUrl">只需首次粘贴「篮球」文件夹链接</label><input id="folderUrl" class="input" value="${esc(root)}" placeholder="https://drive.google.com/drive/folders/..." inputmode="url" autocomplete="off"></div><button class="btn" id="syncRoot">↻ 同步子文件夹与 Excel</button><div class="subnote">总文件夹中放一本记录 Excel。Excel A 列填写完整子文件夹名，B 列填写原始视频文件名，C 列动作（支持新增「篮下反篮」）、D 列结果、E 列备注（第一行可直接是数据）。同步按文件夹名对应记录，不再按日期匹配；不会下载视频内容。</div><div id="importStatus" class="progress"></div><button class="btn secondary" id="clearOldFolders">清理旧文件夹记录（保留视频缓存）</button></div><div class="panel"><h3>本机空间</h3><div id="storageInfo" class="tinyrow">正在读取...</div><button class="btn secondary tiny" id="refreshStorage" style="margin-top:10px">更新存储信息</button><div class="subnote">浏览器可能在存储紧张或清理网站数据时自动清除离线视频；不能保证永久保留。建议 Safari 添加到主屏幕，并在出门前确认缓存状态。</div></div><div class="panel"><h3>当前程序版本</h3><div class="tinyrow">HOOPLOG v23 · 已拍照片中央大字遮罩版。若 GitHub 已发布 v23，而此处仍显示旧版本，请先检查 GitHub Pages 的部署状态，再正常刷新网页；不要清除网站数据，以免丢失本机视频、顾客资料和训练历史。</div></div><div class="panel"><h3>使用须知</h3><div class="tinyrow">① GitHub Pages 仅提供网页代码，视频不会上传到 GitHub。<br>② 文件保留在 Google Drive；已获取的副本保存在本机浏览器 IndexedDB。<br>③ 无网络仍可看已缓存视频；没有缓存的视频无法播放。<br>④ 纯网页不能读取 iPhone 的真实 Wi-Fi 状态，也不能保证后台长时间下载。<br>⑤ 使用个人 Google 账号 OAuth 测试模式时，请将自己列为测试用户。</div></div>`}

 const pending=adv18PendingCount();
 if(adv18.busy)return '正在核对 Google Drive，请勿关闭页面';
 if(adv18PendingTrashCount())return `${adv18PendingTrashCount()} 张照片仍待移入 Google Drive 回收站，暂不能确认删除成功`;
 if(pending)return `${pending} 张照片待上传 · 本机记录已保留`;
 if(adv18.dirty)return '顾客、约拍或评价有修改，尚未同步云端';
 if(adv18ConfirmedSync())return adv18IsOnline()?'Google Drive 同步已核实':'上次同步成功，目前需要重新授权';

}

async function adv18GetMediaDB(id){return new Promise((ok,bad)=>{const tx=db.transaction('adventure_media','readonly'),req=tx.objectStore('adventure_media').get(id);req.onsuccess=()=>ok(req.result||null);req.onerror=()=>bad(req.error)})}
async function adv18PutMedia(id,blob,name){return new Promise((ok,bad)=>{const tx=db.transaction('adventure_media','readwrite');tx.objectStore('adventure_media').put({id,blob,name});tx.oncomplete=ok;tx.onerror=()=>bad(tx.error);tx.onabort=()=>bad(tx.error)})}
async function adv18FetchFile(id){if(!adv18IsOnline())return null;const r=await adv18Request('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media');return r.blob()}
async function adv18GetSrc(assetId){if(adv18.mediaUrls.has(assetId))return adv18.mediaUrls.get(assetId);let media=await adv18GetMediaDB(assetId),blob=media?.blob;if(!blob){const obj=adv18MediaObj(assetId);if(obj?.driveId&&adv18IsOnline()){blob=await adv18FetchFile(obj.driveId);await adv18PutMedia(assetId,blob,obj.fileName||'Google Drive 图片').catch(()=>{})}}if(!blob)return '';const u=URL.createObjectURL(blob);adv18.mediaUrls.set(assetId,u);return u}

async function adv18DeleteTemplate(templateId){
 if(adv18.busy){adv18Notice('正在同步，请同步结束后再删除模板');return}
 const template=adv18.data.templates.find(x=>x.id===templateId&&!x.deleted);
 if(!template)return;
 const shots=adv18.data.shots.filter(x=>!x.deleted&&x.templateId===templateId);
 const plans=adv18.data.plans.filter(x=>!x.deleted&&x.templateId===templateId);
 const message=`确认删除模板《${template.title}》？\n\n关联顾客实拍 ${shots.length} 张、下次约拍 ${plans.length} 项。确认后会一并从网页移除这些关联记录；已上传的模板和实拍原图将移至 Google Drive 回收站。\n\n若目前未授权或断网，先在本机隐藏并标记待云端删除，重新连接后重试。请确认实拍照片不再需要。`;
 if(!confirm(message)){adv18.deleteMenuId='';render();return}
 const now=Date.now();
 for(const rec of [template,...shots]){rec.deleted=true;rec.updatedAt=now;rec.trashedAt=0}
 for(const plan of plans){plan.deleted=true;plan.updatedAt=now}
 adv18.deleteMenuId='';adv18.shotId='';adv18.zoom='';adv18EnsureSelection();
 adv18SaveAndRender(false);
 if(adv18IsOnline()){
  adv18Notice('已标记删除，正在同步 Google Drive 回收站');
  const success=await adv18Sync();
  if(success)toast('模板及关联记录已从网页删除，Google Drive 原图已移至回收站');
  else toast('本机已标记删除，但云端尚未全部确认，请到「云端同步」重试');
 }else adv18Notice('本机已标记删除，云端照片待授权后移入回收站');
}

 const x={id:adv18Id(),assetId,title:adv18.tempForm.name,tech:adv18.tempForm.tech,note:adv18.tempForm.note,fileName:file.name,mime:file.type||'application/octet-stream',created:Date.now(),updatedAt:Date.now(),driveId:''};adv18.data.templates.push(x);adv18.templateId=x.id;adv18.adding='';
}else{const x={id:adv18Id(),assetId,customerId:adv18.clientId,templateId:adv18.templateId,date:new Date().toLocaleDateString('sv-SE'),fileName:file.name,mime:file.type||'application/octet-stream',created:Date.now(),updatedAt:Date.now(),rating:'',note:'',driveId:''};adv18.data.shots.push(x);adv18.shotId=x.id;adv18.view='compare'}

async function adv18Request(url,opt={}){if(!adv18IsOnline())throw Error('Google Drive 写入授权过期，请重新连接');let resp=await fetch(url,{...opt,headers:{...opt.headers,Authorization:'Bearer '+adv18.token}});if(!resp.ok){let body='';try{const j=await resp.json();body=j?.error?.message||''}catch(e){}throw Error('Google Drive '+resp.status+(body?'：'+body:''))}return resp}
async function adv18Authorize(){const clientId=localStorage.getItem('hooplog_client_id');if(!clientId)throw Error('先到 HOOPLOG 设置填写 Google OAuth 客户端 ID');await lazyGoogle();return new Promise((ok,bad)=>{try{const tc=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:'https://www.googleapis.com/auth/drive.file',callback:response=>{if(response?.error||!response?.access_token)return bad(Error(response.error_description||response.error||'Google 未返回授权令牌'));adv18.token=response.access_token;adv18.expiry=Date.now()+Number(response.expires_in||3500)*1000;ok()}});tc.requestAccessToken({prompt:'consent'})}catch(e){bad(e)}})}
function adv18Q(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function adv18List(parent,name){const q=new URLSearchParams({q:`'${adv18Q(parent)}' in parents and name = '${adv18Q(name)}' and trashed = false`,fields:'files(id,name,mimeType),nextPageToken',pageSize:'100'});const r=await adv18Request('https://www.googleapis.com/drive/v3/files?'+q);return (await r.json()).files||[]}
async function adv18CreateFolder(name,parent){let matches=await adv18List(parent,name);let folder=matches.find(x=>x.mimeType==='application/vnd.google-apps.folder');if(folder)return folder.id;const r=await adv18Request('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parent]})});return (await r.json()).id}
async function adv18Root(){if(adv18.rootId){try{const r=await adv18Request('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(adv18.rootId)+'?fields=id,mimeType');const v=await r.json();if(v.mimeType==='application/vnd.google-apps.folder')return adv18.rootId}catch(e){adv18.rootId=''}}const raw=localStorage.getItem('hooplog_adventure_parent')||'';let parent=raw?toFolderId(raw):'root';try{adv18.rootId=await adv18CreateFolder('冒险',parent)}catch(e){if(raw&&/403|404/.test(e.message))throw Error('没有权限写入这个已有文件夹。请留空父文件夹，让应用在我的云端硬盘创建专属「冒险」文件夹；或通过 Google Picker 授权该目录。详情：'+e.message);throw e}localStorage.setItem('hooplog_adventure_root_id',adv18.rootId);return adv18.rootId}
async function adv18Folder(...parts){let parent=await adv18Root();for(const part of parts){const key=parent+'|'+part;if(adv18.subfolders[key]){parent=adv18.subfolders[key];continue}const id=await adv18CreateFolder(part,parent);adv18.subfolders[key]=id;parent=id}return parent}
async function adv18UploadBlob(blob,name,mime,parent){const r=await adv18Request('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,size',{method:'POST',headers:{'Content-Type':'application/json','X-Upload-Content-Type':mime||'application/octet-stream','X-Upload-Content-Length':String(blob.size)},body:JSON.stringify({name,parents:[parent],mimeType:mime||'application/octet-stream'})});const session=r.headers.get('Location');if(!session)throw Error('Google Drive 未返回可续传上传地址');const up=await adv18Request(session,{method:'PUT',headers:{'Content-Type':mime||'application/octet-stream'},body:blob});const created=await up.json();if(!created?.id)throw Error('Google Drive 未返回文件 ID，无法确认上传成功');return created.id}
async function adv18WriteManifest(){const raw=JSON.stringify(adv18.data);const blob=new Blob([raw],{type:'application/json'});if(!adv18.manifestId){const r=await adv18List(await adv18Root(),'冒险资料.json');adv18.manifestId=r.find(x=>x.mimeType==='application/json')?.id||''}
 if(adv18.manifestId){await adv18Request('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(adv18.manifestId)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:blob})}
 else{adv18.manifestId=await adv18UploadBlob(blob,'冒险资料.json','application/json',await adv18Root());localStorage.setItem('hooplog_adventure_manifest_id',adv18.manifestId)}
}
// 对同一条记录做版本合并；不能因本机备注较新就丢失云端图片文件 ID。
function adv18Merge(data){
 for(const category of ['customers','templates','shots','plans']){
  const local=adv18.data[category];
  const remote=Array.isArray(data?.[category])?data[category]:[];
  const key=x=>category==='plans'?x.customerId+':'+x.templateId:x.id;
  const map=new Map(remote.filter(x=>x&&typeof x==='object').map(x=>[key(x),x]));
  for(const x of local){
   if(!x||typeof x!=='object')continue;
   const k=key(x),y=map.get(k);
   if(!y){map.set(k,x);continue}
   const newest=(x.updatedAt||0)>(y.updatedAt||0)?x:y;
   if(category==='templates'||category==='shots'){
    // Deletion tombstones win against stale photo records from another device.
    const deleted=x.deleted||y.deleted;
    const tombstone=x.deleted?x:y.deleted?y:null;
    map.set(k,{...newest,...(tombstone||{}),deleted:!!deleted,driveId:newest.driveId||x.driveId||y.driveId||'',trashedAt:x.trashedAt||y.trashedAt||0,updatedAt:Math.max(x.updatedAt||0,y.updatedAt||0)});
   }else map.set(k,newest);
  }
  adv18.data[category]=[...map.values()];
 }
 const removed=new Set(adv18.data.templates.filter(x=>x.deleted).map(x=>x.id));
 if(removed.size){const now=Date.now();
  for(const rec of adv18.data.shots)if(removed.has(rec.templateId)&&!rec.deleted){rec.deleted=true;rec.trashedAt=0;rec.updatedAt=now}
  for(const p of adv18.data.plans)if(removed.has(p.templateId)&&!p.deleted){p.deleted=true;p.updatedAt=now}
 }
}

// 同步函数返回明确成功/失败状态，禁止 OAuth 成功但照片或索引失败时显示同步成功。
async function adv18Sync(){
 if(adv18.busy){adv18.retry=true;return false}
 if(!adv18IsOnline()){adv18.status='授权已过期或网络中断；上传任务保留在本机';if(state.tab==='adventure')render();return false}
 adv18.busy=true;adv18.status='正在同步 Google Drive';if(state.tab==='adventure')render();
 let allDone=false;
 try{
  await adv18Root();
  // Before every cloud index write, re-read the latest remote records to avoid
  // silently overwriting customers and photos changed by another device.
  await adv18LoadRemote();
  let missing=0;
  for(const rec of [...adv18.data.templates,...adv18.data.shots]){
   if(!rec.deleted||!rec.driveId||rec.trashedAt)continue;
   // Move to Google Drive trash rather than permanently deleting personal photos.
   const trashedResponse=await adv18Request('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(rec.driveId)+'?fields=id,trashed',{
    method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})
   });
   const confirmed=await trashedResponse.json();
   if(confirmed?.trashed!==true)throw Error('Google Drive 尚未确认移至回收站，请重试');
   rec.trashedAt=Date.now();rec.updatedAt=rec.trashedAt;adv18Store();
  }
  for(const rec of [...adv18.data.templates,...adv18.data.shots]){
   if(rec.deleted||rec.driveId)continue;
   const f=await adv18GetMediaDB(rec.assetId);
   if(!f?.blob){missing++;continue}
   let folder;
   if(adv18.data.templates.includes(rec))folder=await adv18Folder('姿势模板');
   else{
    const c=adv18.data.customers.find(x=>x.id===rec.customerId);
    const t=adv18.data.templates.find(x=>x.id===rec.templateId);
    folder=await adv18Folder('顾客实拍',`${(c?.name||'未知顾客').replace(/[\/]/g,'_')}__${rec.customerId.slice(-6)}`,`${(t?.title||'未知模板').replace(/[\/]/g,'_')}__${rec.templateId.slice(-6)}`);
   }
   const id=await adv18UploadBlob(f.blob,rec.fileName||'照片.jpg',rec.mime||f.blob.type||'application/octet-stream',folder);
   rec.driveId=id;rec.updatedAt=Date.now();adv18Store();
   if(state.tab==='adventure')render();
  }
  // 部分照片因本机原件缺失而无法上传，也应把已完成记录的索引写回 Drive。
  await adv18WriteManifest();
  const pending=adv18PendingCount(),pendingTrash=adv18PendingTrashCount();
  allDone=pending===0 && missing===0 && pendingTrash===0;
  if(allDone){
   adv18.dirty=false;
   localStorage.removeItem(ADV18_SYNC_PENDING_KEY);
   adv18.lastSyncedAt=Date.now();
   localStorage.setItem(ADV18_LAST_SYNC_KEY,String(adv18.lastSyncedAt));
  }
  adv18.status=allDone?(adv18.data.customers.length?'照片及顾客资料索引已核对':'照片及资料索引已核对；目前没有顾客档案'):`部分完成：${pending} 张照片待上传、${pendingTrash} 张待移入回收站${missing?'（其中 '+missing+' 张缺少本机原件）':''}`;
  // Delete local photo blobs only after the cloud trash and index writes succeed.
  if(allDone)for(const rec of [...adv18.data.templates,...adv18.data.shots])if(rec.deleted&&(!rec.driveId||rec.trashedAt))await adv18DiscardLocalMedia(rec.assetId).catch(e=>console.warn('删除本机照片失败',e));
  adv18.syncMessage=allDone?'已完成云端写入确认':'请在保留原照片的设备上重新连接，并重试待上传项目';
 }catch(e){
  adv18.status='同步失败：'+(e?.message||String(e));
  adv18.syncMessage='上传未确认完成的照片仍保存在本机，可重新连接并重试';
  console.error('冒险同步失败',e);
 }finally{
  adv18.busy=false;
  if(state.tab==='adventure')render();
  if(adv18.retry){adv18.retry=false;void adv18Sync()}
 }
 return allDone;
}

function parseCSV(t){let rows=[],r=[],v='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);if(r.some(Boolean))rows.push(r);r=[];v=''}else v+=c}r.push(v);if(r.some(Boolean))rows.push(r);return rows}
async function loadSheetJS(){if(window.XLSX)return;let urls=['https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];for(let src of urls){try{await new Promise((ok,bad)=>{let sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=bad;document.head.appendChild(sc)});if(window.XLSX)return}catch(e){}}throw Error('Excel 解析组件未能联网加载；可以先将表格另存为 CSV 后导入')}
function convertRows(rows,folder){let i=rows.findIndex(x=>{let text=(x||[]).slice(0,6).join(' ');return text.includes('日期')&&text.includes('动作类型')&&text.includes('结果')});if(i<0)throw Error('找不到“日期、动作类型、结果”表头');let hdr=rows[i].map(x=>String(x??'').trim());let col=t=>hdr.findIndex(x=>x.includes(t)),ai=col('日期'),bi=col('片段编号'),ci=col('动作类型'),di=col('结果'),ei=col('备注');if(bi<0)throw Error('没有找到“片段编号”列');let rs=rows.slice(i+1).map(x=>({date:dateText(x[ai]),clip:String(x[bi]??'').trim(),action:String(x[ci]??'').trim(),result:normResult(x[di]),note:String(x[ei]??'').trim()})).filter(x=>x.clip||x.action||x.note);let currentDate=folder?.date; if(currentDate){let matching=rs.filter(x=>x.date===currentDate);if(!matching.length&&rs.some(x=>x.date))throw Error('Excel 未找到与文件夹日期 '+currentDate+' 对应的行，请检查文件夹命名');rs=matching}return rs.filter(x=>x.clip)}
async function importExcelBlob(blob,name){let f=current();if(!f)throw Error('先选择一个子文件夹');let rows;if(/\.csv$/i.test(name))rows=parseCSV((await blob.text()).replace(/^\uFEFF/,''));else{await loadSheetJS();let wb=XLSX.read(await blob.arrayBuffer(),{type:'array',cellDates:false});let sheet=wb.SheetNames.find(x=>x.includes('小岩')&&!x.includes('汇总'))||wb.SheetNames[0];rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:'',raw:true})}let records=convertRows(rows,f);if(!records.length)throw Error('没有匹配当前日期的有效 Excel 记录');f.records=records;f.savedAt=Date.now();await idbPut('folders',{id:f.id,name:f.name,date:f.date,files:f.files,records,savedAt:f.savedAt});await refreshLocal();let match=vfiles(f).filter(x=>fileRecord(f,x)).length;toast(`已导入 ${records.length} 条记录；匹配 ${match} 个视频`);return {records:records.length,match}}
async function importDriveExcel(){let f=current();if(!f)throw Error('先选择文件夹');let arr=f.files.filter(x=>x.kind==='sheet').sort((a,b)=>(b.modifiedTime||'').localeCompare(a.modifiedTime||''));if(!arr.length)throw Error('该文件夹没有 Excel/CSV，请选择本地 Excel');await auth();let file=arr[0];let res=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media');return importExcelBlob(await res.blob(),file.name)}
async function refreshStorage(){let el=$('#storageInfo');if(!el)return;try{let e=await navigator.storage.estimate();let v=await idbAll('videos');let cache=v.reduce((s,x)=>s+Number(x.size||0),0);el.textContent=`视频实际保存 ${v.length} 个（约 ${bytes(cache)}）· 浏览器已使用 ${bytes(e.usage)} · 可用配额上限 ${bytes(e.quota)}（估计值）`}catch(err){el.textContent='浏览器无法提供存储使用量'}}
async function eventClick(e){let t=e.target.closest('[data-adv18], button, label');if(!t)return;try{if(t.dataset.tab){setTab(t.dataset.tab);return}if(state.tab==='adventure'&&t.closest('[data-adv18]')){await adv18HandleClick(t.closest('[data-adv18]'));return}if(t.dataset.train14Open){train14.view='practice';train14.large=false;render();return}if(t.dataset.train14Back){train14Stop(false);train14.view='list';train14.large=false;render();return}if(t.dataset.train14Play){if(train14.running)train14Stop();else train14Start();return}if(t.dataset.train14Focus){train14.large=!train14.large;render();return}if(t.dataset.statMode){state.statsMode=t.dataset.statMode;render();return}if(t.dataset.v13Toggle){state.v13ChromeOpen=!state.v13ChromeOpen;render();return}if(t.dataset.statPickerToggle){state.statsPickerOpen=!state.statsPickerOpen;render();return}if(t.dataset.statReset){state.statsSelectionCustom=false;state.statsSelected=v12AutoSelection(state.folders).folders.map(f=>f.id);render();return}if(t.dataset.statPreset){const sorted=[...state.folders].sort((a,b)=>{let x=String(a.name).match(/^(?:20\d{2})?(\d{2})(\d{2})/),y=String(b.name).match(/^(?:20\d{2})?(\d{2})(\d{2})/);return (x?Number(x[1])*100+Number(x[2]):0)-(y?Number(y[1])*100+Number(y[2]):0)||String(a.name).localeCompare(String(b.name),'zh-CN',{numeric:true})});state.statsSelectionCustom=true;state.statsSelected=(t.dataset.statPreset==='all'?sorted:sorted.slice(-2)).map(f=>f.id);render();return}if(t.dataset.pick){state.folderId=t.dataset.pick;await updateCachedCounts();render();return}if(t.dataset.filter){state.filter=t.dataset.filter;render();return}if(t.dataset.play){await play(t.dataset.play);return}switch(t.id){case 'syncRoot':await syncRoot();break;case 'clearOldFolders':{if(!confirm('清理以前导入的文件夹记录和演示数据？不会删除已缓存的视频。清理后需要重新同步「篮球」。'))break;for(const f of await idbAll('folders'))await idbDelete('folders',f.id);state.folderId=null;await refreshLocal();toast('旧文件夹记录已清理，视频缓存未删除');break;}case 'downloadAll':await cacheFolder();break;case 'stop':state.stop=true;state.controller?.abort();toast('正在停止下载');break;case 'clearFolder':await clearFolder();break;case 'saveClient':{let val=$('#clientId').value.trim();if(val&&!/\.apps\.googleusercontent\.com$/.test(val))throw Error('客户端 ID 格式不正确');localStorage.setItem('hooplog_client_id',val);state.token=null;state.tokenExpiry=0;adv18.token=null;adv18.expiry=0;toast('客户端 ID 已保存');render();break}case 'googleLogin':{await auth();toast('Google 授权成功');render();break}case 'signout':{let tkn=state.token;let advToken=adv18.token;state.token=null;state.tokenExpiry=0;adv18.token=null;adv18.expiry=0;if(advToken&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(advToken,()=>{});if(tkn&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(tkn,()=>{});render();break}case 'refreshStorage':await refreshStorage();break;case 'closeVideo':closePlayer();break;}}catch(err){console.error('HOOPLOG operation failed',err);const message=err instanceof Error?err.message:(typeof err==='string'?err:(err&&typeof err.message==='string'?err.message:'操作失败（浏览器返回了空错误信息，请检查 Google 授权）'));toast(message);const p=$('#downloadProgress');if(p&&!state.downloading)p.textContent='操作未完成：'+message;const im=$('#importStatus');if(im)im.textContent='操作未完成：'+message}}
let adv18PressTimer=null,adv18PressStart=null;
function adv18CancelPress(){if(adv18PressTimer){clearTimeout(adv18PressTimer);adv18PressTimer=null}adv18PressStart=null}
document.addEventListener('pointerdown',e=>{
 if(e.button!==0||state.tab!=='adventure'||adv18.view!=='gallery')return;
 const el=e.target.closest('.adv-template-press');if(!el||e.target.closest('.adv-delete-pop'))return;
 adv18CancelPress();const id=el.dataset.templateId;
 adv18PressStart={pointerId:e.pointerId,x:e.clientX,y:e.clientY};
 adv18PressTimer=setTimeout(()=>{adv18PressTimer=null;adv18PressStart=null;adv18.deleteMenuId=id;adv18.longPressIgnoreUntil=Date.now()+1100;render()},650);
},{passive:true});
document.addEventListener('pointermove',e=>{if(adv18PressStart?.pointerId===e.pointerId&&Math.hypot(e.clientX-adv18PressStart.x,e.clientY-adv18PressStart.y)>11)adv18CancelPress()},{passive:true});
document.addEventListener('pointerup',adv18CancelPress,{passive:true});
document.addEventListener('pointercancel',adv18CancelPress,{passive:true});
document.addEventListener('contextmenu',e=>{
 const el=e.target.closest('.adv-template-press');if(!el||state.tab!=='adventure'||adv18.view!=='gallery')return;
 e.preventDefault();adv18CancelPress();adv18.deleteMenuId=el.dataset.templateId;adv18.longPressIgnoreUntil=Date.now()+1100;render();
});
document.addEventListener('click',eventClick);document.addEventListener('change',async e=>{if(state.tab==='adventure'&&adv18HandleChange(e.target))return;if(e.target.id==='train14-mode'&&!train14.running){train14.mode=e.target.value;render();return}if(e.target.id==='train14-speed'&&!train14.running){train14.period=Number(e.target.value);render();return}if(e.target.id==='train14-hide'&&!train14.running){train14.hideArrow=e.target.checked;render();return}if(e.target.dataset?.statFolder){const id=e.target.dataset.statFolder;state.statsSelectionCustom=true;state.statsSelected=e.target.checked?[...new Set([...state.statsSelected,id])]:state.statsSelected.filter(x=>x!==id);render();return}if(e.target.id==='statAction'){state.statsAction=e.target.value;render();return}if(false && e.target.id==='excelInput'){let file=e.target.files?.[0];if(!file)return;try{let r=await importExcelBlob(file,file.name);let el=$('#importStatus');if(el)el.textContent=`Excel 成功：${r.records} 条记录，${r.match} 个视频匹配`}catch(err){toast(err?.message||'导入失败');let el=$('#importStatus');if(el)el.textContent=err?.message||'导入失败'}}});
window.addEventListener('online',()=>{setBadge()});window.addEventListener('offline',()=>{state.stop=true;state.controller?.abort();setBadge()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&train14.running)train14Stop();if(document.hidden&&state.downloading){state.stop=true;state.controller?.abort();toast('页面进入后台，下载已暂停')}});
(async()=>{try{db=await openDB();await refreshLocal();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js?v=23',{updateViaCache:'none'}).catch(e=>console.warn('SW unavailable',e));}catch(e){console.error(e);$('#page').innerHTML='<div class="alert danger">当前浏览器无法使用本地视频数据库，请尝试从 Safari 打开 HTTPS 网站并关闭无痕模式。'+esc(e?.message||'未知错误')+'</div>'}})();
})();
