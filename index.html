<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;color:var(--text);padding-bottom:calc(95px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.38;cursor:not-allowed}a{color:var(--green)}main{max-width:760px;margin:auto;padding:16px 16px 22px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.brand{font-size:18px;letter-spacing:1.5px;font-weight:900}.brand span{display:inline-block;background:var(--green);color:#15211c;padding:7px 9px;border-radius:10px;margin-right:7px}.subtitle,.muted{color:var(--muted);font-size:12px;line-height:1.65}.title{font-size:23px;font-weight:800;letter-spacing:-.6px;margin:9px 0 6px}h2{font-size:16px;margin:22px 0 10px}h3{margin:0 0 7px;font-size:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin:11px 0}.hero{background:linear-gradient(125deg,#2f442e,#1b2a26 80%);border:1px solid #53704b;border-radius:19px;padding:18px;margin:14px 0}.score{font-size:65px;line-height:1.1;font-weight:900;letter-spacing:-2px;color:var(--green)}.score small{font-size:12px;letter-spacing:0}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.wrap{flex-wrap:wrap}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{border-radius:13px;background:var(--panel2);padding:11px}.stat b{display:block;font-size:23px}.stat small{color:var(--muted);font-size:11px}.pill{border-radius:20px;padding:5px 9px;background:#33413c;color:#d0e8d2;font-size:11px;white-space:nowrap}.pill.ok{background:#24472e;color:#bbedae}.pill.warn{background:#453e25;color:#fff2ae}.pill.err{background:#492e30;color:#ffd1c9}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:750;background:var(--green);color:#17241c;font-size:13px;min-height:43px}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#4e2a2c;color:#ffd5cd}.btn.tiny{padding:8px 10px;min-height:33px;font-size:11px}.btn:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}.input{background:#131d20;color:var(--text);border:1px solid #526363;border-radius:11px;padding:12px;width:100%;font-size:14px;min-width:0}.input::placeholder{color:#758c8c}.field{display:grid;gap:7px}.field label{font-size:12px;color:#b5c6c4}.subnote{font-size:11px;color:#a8bdba;line-height:1.7;margin-top:8px}.folder{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;text-align:left;width:100%;color:var(--text);margin:8px 0}.folder.selected{border-color:#acd767;background:#223327}.folder-info{min-width:0;flex:1}.folder-name{font-size:14px;font-weight:750;overflow-wrap:anywhere}.meter{height:8px;border-radius:9px;background:#374649;overflow:hidden}.meter>div{height:100%;background:var(--green);border-radius:9px;transition:width .2s}.clip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;color:var(--text);margin:8px 0}.clip .ico{background:#334640;padding:12px;border-radius:12px;color:var(--green)}.clip .info{min-width:0;flex:1}.clip .info b{font-size:13px;display:block;overflow-wrap:anywhere}.clip .info small{color:var(--muted);font-size:11px;display:block;margin-top:3px;overflow-wrap:anywhere}.dot{width:8px;height:8px;background:#a0a0a0;border-radius:100%;flex-shrink:0}.dot.ok{background:#b8ed87}.tabs{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:760px;background:#151f22ed;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:3px;z-index:10}.tab{background:transparent;border:0;color:#91a6a5;font-size:12px;padding:8px 3px}.tab[aria-selected=true]{color:var(--green);font-weight:800}.tab i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.alert{border-radius:12px;padding:11px 12px;border:1px solid #5d6145;background:#302f24;color:#e7e1b0;font-size:12px;line-height:1.6;margin:11px 0}.alert.danger{border-color:#684449;background:#3c292d;color:#ffd3c9}.alert.good{border-color:#385c45;background:#263d2e;color:#c4e9c5}.empty{text-align:center;padding:25px 12px;color:var(--muted);font-size:13px;line-height:1.7}.progress{font-size:12px;color:#c0d4bd;min-height:18px;line-height:1.6}.divider{border:0;border-top:1px solid var(--line);margin:15px 0}.shot{margin:12px 0}.shot b{font-size:13px}.shot small{font-size:11px;color:var(--muted)}.filters{display:flex;gap:8px;overflow-x:auto;padding:5px 0 12px}.filter{white-space:nowrap;background:var(--panel2);color:#d7e4e0;border:1px solid var(--line);padding:8px 12px;border-radius:20px;font-size:12px}.filter.active{background:var(--green);color:#19301b}.player{position:fixed;inset:0;background:#050b0af5;z-index:40;padding:calc(15px + env(safe-area-inset-top)) 15px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:13px;overflow-y:auto}.player video{width:100%;max-height:56vh;background:black;border-radius:15px}.player h2{margin:0}.player .notes{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e2929;border-radius:12px;padding:12px;color:#dce5df;font-size:13px}input[type=checkbox]{accent-color:#a9d86a;transform:scale(1.2);margin-right:9px}label.check{display:flex;gap:7px;align-items:start;font-size:12px;line-height:1.5;color:#dce6dd}.hide{display:none!important}.tinyrow{font-size:12px;color:#b9cfca;line-height:1.65}.chip{display:inline-block;border:1px solid #445455;border-radius:9px;padding:5px 8px;color:#bfd2cb;font-size:11px}.warning-text{color:#ffc1aa}#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border-radius:12px;background:#e1f8ac;color:#1e301e;padding:11px 15px;z-index:50;font-size:13px;box-shadow:0 4px 25px #0006;max-width:92vw;min-width:180px;text-align:center;display:none}
</style>
</head>
<body>
<main>
<header><div><div class="brand"><span>↗</span>HOOPLOG</div><div class="subtitle">篮球数据 · Google Drive · 本机离线片段</div></div></header>
<div id="page"></div>
</main>
<nav class="tabs" aria-label="主导航"><button class="tab" data-tab="folders" aria-selected="true"><i>▦</i>文件夹</button><button class="tab" data-tab="stats" aria-selected="false"><i>◴</i>数据统计</button><button class="tab" data-tab="clips" aria-selected="false"><i>▷</i>视频片段</button><button class="tab" data-tab="settings" aria-selected="false"><i>⚙</i>设置</button></nav>
<div id="videoOverlay" class="player hide" role="dialog" aria-modal="true" aria-label="离线视频播放器"><div class="row"><h2 id="videoTitle">离线播放</h2><button class="btn secondary" id="closeVideo">关闭 ✕</button></div><video id="videoPlayer" controls playsinline preload="metadata" disablepictureinpicture></video><div id="videoMeta" class="tinyrow"></div><div id="videoNote" class="notes"></div><div class="alert good">本播放器只使用本机已缓存视频，不会从 Google Drive 联网播放。</div></div>
<div id="toast" role="status"></div>
<script>
/* HOOPLOG: Github Pages 静态单页应用。所有视频都写入当前设备 IndexedDB，不上传至 Github。 */
(()=>{'use strict';
const $=q=>document.querySelector(q), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>{n=Number(n||0);return n>=1073741824?(n/1073741824).toFixed(2)+' GB':n>=1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(1)+' KB'};
const safeId=s=>String(s??'').trim(); const vidExt=/\.(mp4|m4v|mov|webm)$/i, sheetExt=/\.(xlsx|xls|csv)$/i;
const state={tab:'folders',folders:[],folderId:null,filter:'全部',token:null,tokenExpiry:0,downloading:false,controller:null,stop:false,stats:[],playerUrl:null};
let db;let toastTimer;
const toast=(msg)=>{const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',3500)};
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('hooplog-offline-v1',1);req.onupgradeneeded=()=>{let d=req.result; if(!d.objectStoreNames.contains('folders'))d.createObjectStore('folders',{keyPath:'id'});if(!d.objectStoreNames.contains('videos')){let v=d.createObjectStore('videos',{keyPath:'id'});v.createIndex('folderId','folderId',{unique:false})}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
const idbGet=(store,key)=>new Promise((resolve,reject)=>{let req=db.transaction(store,'readonly').objectStore(store).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
const idbAll=store=>new Promise((resolve,reject)=>{let req=db.transaction(store,'readonly').objectStore(store).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
const idbPut=(store,val)=>new Promise((resolve,reject)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('写入缓存失败'))});
const idbDelete=(store,key)=>new Promise((resolve,reject)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
const current=()=>state.folders.find(f=>f.id===state.folderId);
const vfiles=f=>(f?.files||[]).filter(x=>x.kind==='video');
const normalizeName=name=>String(name??'').trim().split(/[\\/]/).pop().normalize('NFKC').toLocaleLowerCase().replace(/\.(mp4|m4v|mov|webm)$/i,'');
const normResult=r=>String(r||'').trim();
function dateText(v){if(v==null||v==='')return '';if(v instanceof Date)return v.toISOString().slice(0,10);if(typeof v==='number'){let d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return isNaN(+d)?'':d.toISOString().slice(0,10)}let s=String(v).trim();let m=s.match(/(20\d{2})[-/.年](\d{1,2})[-/.月](\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;return s}
const guessDate=name=>dateText(name);
function fileRecord(folder,video){let key=normalizeName(video.name);return (folder?.records||[]).find(r=>normalizeName(r.clip)===key)||null}
function stats(folder){let rows=folder?.records||[];let cats=['原地投篮','突破上篮','篮下直接终结','突破急停跳投'];let item=cats.map(name=>{let v=rows.filter(r=>r.action===name);return {name,made:v.filter(r=>r.result==='成功').length,total:v.length}});let made=item.reduce((n,x)=>n+x.made,0),total=item.reduce((n,x)=>n+x.total,0);return{made,total,points:made*2,cats:item,turnovers:rows.filter(r=>r.action==='失误').length,invalid:rows.filter(r=>r.action==='无效运球').length,classified:rows.filter(r=>r.action).length,recorded:rows.length}}
async function cleanLegacyMetadata(){
 const root=localStorage.getItem('hooplog_root_id');
 for(const f of await idbAll('folders')){
  // Delete demo metadata even before first sync; never delete video blobs.
  if(String(f.id).startsWith('demo-')||/【演示】|\[演示\]/.test(f.name||'')||(root&&f.rootId!==root))await idbDelete('folders',f.id);
 }
}
async function refreshLocal(){await cleanLegacyMetadata();state.folders=(await idbAll('folders')).sort((a,b)=>String(b.name||'').localeCompare(String(a.name||''),'zh-CN', {numeric:true})||b.savedAt-a.savedAt);if(!state.folders.some(x=>x.id===state.folderId))state.folderId=state.folders[0]?.id||null;await updateCachedCounts();render()}
async function updateCachedCounts(){let stored=await idbAll('videos');for(let f of state.folders){let entries=stored.filter(v=>v.folderId===f.id);const saved=new Map(entries.map(v=>[v.id,v]));for(const item of f.files)item.cached=!!(saved.has(item.id)&&saved.get(item.id).modifiedTime===item.modifiedTime);f.cached=f.files.filter(x=>x.kind==='video'&&x.cached).length;f.cacheBytes=entries.reduce((n,v)=>n+(v.size||0),0)}}
function netType(){const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;if(!navigator.onLine)return 'offline';if(!conn||!conn.type||conn.type==='unknown')return 'unknown';return conn.type==='wifi'||conn.type==='ethernet'?'wifi':conn.type==='cellular'?'cellular':'unknown'}
function canDownload(){if(!navigator.onLine)throw Error('当前离线，无法下载视频');if(netType()==='cellular')throw Error('检测到蜂窝网络，已阻止下载');}
function setBadge(){} 
function nav(title,sub){return `<div class="title">${title}</div><div class="subtitle">${sub}</div>`}
function folderButtons(){return state.folders.map(f=>`<button class="folder ${state.folderId===f.id?'selected':''}" data-pick="${esc(f.id)}"><span class="folder-info"><span class="folder-name">📁 ${esc(f.name)}</span><div class="muted">${vfiles(f).length} 段视频 · 已缓存 ${f.cached||0} 段 · ${bytes(f.cacheBytes)}</div></span><span class="pill ${f.cached===vfiles(f).length&&f.cached>0?'ok':''}">${f.cached||0}/${vfiles(f).length}</span></button>`).join('')||'<div class="empty">还没有同步子文件夹。请先连接 Google Drive 中的「篮球」总文件夹。</div>'}
function folderPage(){let f=current(),root=localStorage.getItem('hooplog_root_url')||'';return nav('训练文件夹','篮球总文件夹 · 按 Excel A 列文件夹名匹配')+`<div class="panel stack"><h3>Google Drive · 篮球总文件夹</h3><div class="field"><label for="folderUrl">只需首次粘贴「篮球」文件夹链接</label><input id="folderUrl" class="input" value="${esc(root)}" placeholder="https://drive.google.com/drive/folders/..." inputmode="url" autocomplete="off"></div><button class="btn" id="syncRoot">↻ 同步子文件夹与 Excel</button><div class="subnote">总文件夹中放一本记录 Excel。Excel A 列填写完整子文件夹名，B 列填写原始视频文件名，C 列动作、D 列结果、E 列备注（第一行可直接是数据）。同步按文件夹名对应记录，不再按日期匹配；不会下载视频内容。</div><div id="importStatus" class="progress"></div><button class="btn secondary" id="clearOldFolders">清理旧文件夹记录（保留视频缓存）</button></div><h2>我的子文件夹</h2>${folderButtons()}`+(f?`<div class="panel"><div class="row"><div><h3>已选择文件夹</h3><div class="muted">${vfiles(f).length} 个视频 · ${f.records?.length||0} 行动作记录</div></div><span class="pill ${f.cached===vfiles(f).length&&f.cached>0?'ok':'warn'}">${f.cached||0}/${vfiles(f).length} 离线</span></div><div class="meter" style="margin:15px 0 6px"><div style="width:${vfiles(f).length?(f.cached||0)/vfiles(f).length*100:0}%"></div></div><div class="muted">本机视频缓存 ${bytes(f.cacheBytes)}</div><div class="subnote">下载前会连续询问两次是否连接 Wi-Fi；iPhone Safari 无法强制阻止蜂窝数据，确认后仍需留意网络切换。</div><div class="row wrap" style="margin-top:14px"><button class="btn" id="downloadAll" ${state.downloading?'disabled':''}>↓ 一键缓存本文件夹</button><button class="btn secondary" id="stop" ${!state.downloading?'disabled':''}>停止下载</button><button class="btn danger" id="clearFolder" ${state.downloading?'disabled':''}>删除本文件夹缓存</button></div><div id="downloadProgress" class="progress" style="margin-top:10px">${state.downloading?'正在缓存，请保持页面前台打开':'未缓存的视频不能播放；播放不会联网获取视频。'}</div></div>`:'');}
function statsPage(){let f=current();if(!f)return nav('数据统计','按 Excel 的原始记录汇总')+'<div class="empty">先从「文件夹」选择一个日期</div>';let s=stats(f),percent=s.total?(100*s.made/s.total).toFixed(1):'—';return nav('数据统计',esc(f.name)+' · 所有数值按已记录的动作计算')+`<div class="hero"><div class="muted">TOTAL POINTS / 当日得分</div><div class="score">${s.points}<small> PTS</small></div><div class="row"><div>出手 <b>${s.total}</b> · 命中 <b>${s.made}</b></div><div class="pill ok">命中率 ${percent}${s.total?'%':''}</div></div></div><div class="grid3"><div class="stat"><b>${vfiles(f).length}</b><small>视频文件</small></div><div class="stat"><b>${s.classified}</b><small>已分类</small></div><div class="stat"><b>${f.cached||0}</b><small>已离线缓存</small></div></div><h2>动作分析</h2><div class="panel">${s.cats.map(x=>`<div class="shot"><div class="row"><div><b>${x.name}</b><div><small>${x.made}中 / ${x.total}投 · ${x.made*2} 分</small></div></div><b>${x.total?(100*x.made/x.total).toFixed(1)+'%':'—'}</b></div><div class="meter" style="margin-top:8px"><div style="width:${x.total?100*x.made/x.total:0}%"></div></div></div>`).join('')}</div><div class="grid2"><div class="stat"><small>无效运球</small><b>${s.invalid}</b></div><div class="stat"><small>失误</small><b>${s.turnovers}</b></div></div><div class="alert">统计只包含 Excel 中已有的分类记录；没有分类或没有对应视频的记录不会被误判为出手。得分暂按每次命中 2 分计算。</div>`;}
function clipsPage(){let f=current();if(!f)return nav('视频片段','本机已缓存才允许播放')+'<div class="empty">先选择一个子文件夹</div>';let all=vfiles(f),rows=all.filter(x=>{let r=fileRecord(f,x);return state.filter==='全部'||state.filter==='已缓存'&&x.cached||state.filter==='未缓存'&&!x.cached||state.filter==='命中'&&r?.result==='成功'||state.filter==='未中'&&r?.result==='失败'||state.filter==='失误'&&r?.action==='失误'});return nav('视频片段',esc(f.name)+' · 所有播放均为离线，不会产生视频网络请求')+`<div class="filters">${['全部','已缓存','未缓存','命中','未中','失误'].map(x=>`<button class="filter ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="tinyrow">${rows.length} 条视频 · 点击绿色状态的片段即可播放 · 视频编号使用原文件名</div>${rows.map(v=>{let r=fileRecord(f,v);return `<button class="clip" data-play="${esc(v.id)}"><span class="ico">▶</span><span class="info"><b>${esc(v.name)}</b><small>${esc(r?.action||'未分类')}${r?.result?' · '+esc(r.result):''} ${r?.note?' · '+esc(r.note).slice(0,70):''}</small></span><span class="pill ${v.cached?'ok':'warn'}">${v.cached?'已离线':'未缓存'}</span></button>`}).join('')||'<div class="empty">没有符合条件的片段</div>'}`;}

async function listTree(id){let queue=[{id,path:''}],files=[],visited=new Set;while(queue.length){let dir=queue.shift();if(visited.has(dir.id))continue;visited.add(dir.id);if(visited.size>300)throw Error('子文件夹超过 300 层级/数量限制');let items=await children(dir.id);for(const a of items){if(a.mimeType==='application/vnd.google-apps.folder')queue.push({id:a.id,path:dir.path+a.name+'/'});else if(vidExt.test(a.name)||sheetExt.test(a.name)){files.push({...a,kind:vidExt.test(a.name)?'video':'sheet',relativePath:dir.path+a.name});if(files.length>2500)throw Error('超过 2500 个文件，请分多个日期文件夹')}}}return files}
function dateKey(v){
 if(v==null||v==='')return '';
 if(typeof v==='number' && v>20000 && v<100000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return `${String(d.getUTCMonth()+1).padStart(2,'0')}${String(d.getUTCDate()).padStart(2,'0')}`;}
 const s=String(v).trim().normalize('NFKC');
 let m=s.match(/(?:20\\d{2})[-/.年]\\s*(\\d{1,2})[-/.月]\\s*(\\d{1,2})/);
 if(m)return m[1].padStart(2,'0')+m[2].padStart(2,'0');
 m=s.match(/^(\\d{1,2})[-/.月]\\s*(\\d{1,2})(?:日|\\D|$)/);
 if(m)return m[1].padStart(2,'0')+m[2].padStart(2,'0');
 m=s.match(/^(\\d{2})(\\d{2})(?!\\d)/);

function folderDateKey(name){
 let s=String(name).trim().normalize('NFKC');
 let m=s.match(/^(?:20\\d{2})[-/.年]?(\\d{1,2})[-/.月]?(\\d{1,2})(?!\\d)/);
 if(m)return m[1].padStart(2,'0')+m[2].padStart(2,'0');

function normalizeFolderName(value){

function readRowsFromArray(rows){
 // 实际Excel：A=文件夹名、B=原始视频文件名、C=动作、D=成功/失败、E=备注；首行可以直接是数据。
 // 也兼容第一行有表头的同样列结构。
 return rows.map((x,i)=>{
  const a=String(x?.[0]??'').trim(),b=String(x?.[1]??'').trim();
  if(!a||!b||!/\.(mp4|mov|m4v|webm)$/i.test(b))return null;
  if(i===0&&/^(文件夹|文件夹名称|目录|场次)$/i.test(a))return null;
  if(/^(文件名|视频文件名|片段编号|视频名称)$/i.test(b))return null;
  return {folderName:a,folderKey:normalizeFolderName(a),clip:b,
   action:String(x?.[2]??'').trim(),result:normResult(x?.[3]),note:String(x?.[4]??'').trim()};
 }).filter(Boolean);
}
async function readMasterSheet(blob,name){

  if(/汇总|统计|趋势/.test(sn))continue;
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true});
  out.push(...readRowsFromArray(rows));
 }
 return out;
}
async function syncRoot(){
 const raw=$('#folderUrl')?.value.trim()||localStorage.getItem('hooplog_root_url');
 const id=toFolderId(raw);await auth();

 if(!dirs.length)throw Error('总文件夹下未找到子文件夹');

 const excel=sheets.sort((a,b)=>(b.modifiedTime||'').localeCompare(a.modifiedTime||''))[0];
 const r=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(excel.id)+'?alt=media');
 const records=await readMasterSheet(await r.blob(),excel.name);
 if(!records.length)throw Error('Excel 未找到有效记录：请确认 A 列为文件夹名、B 列为视频文件名，并检查 Excel 是否已上传最新版。');
 let folders=[],unmatched=[];
 for(const d of dirs){
  const files=await listTree(d.id);
  const rows=records.filter(x=>x.folderKey===normalizeFolderName(d.name));
  const f={id:d.id,name:d.name,date:d.name,files,records:rows,savedAt:Date.now(),rootId:id};
  await idbPut('folders',f);folders.push(f);
  if(!rows.length)unmatched.push(d.name);

 localStorage.setItem('hooplog_root_id',id);
 // Remove obsolete demo and old-date metadata, but never delete cached videos.
 for(const f of await idbAll('folders'))if(!folders.some(x=>x.id===f.id))await idbDelete('folders',f.id);
 if(!folders.some(f=>f.id===state.folderId))state.folderId=folders[0].id;
 await refreshLocal();
 const matched=folders.reduce((n,f)=>n+vfiles(f).filter(v=>fileRecord(f,v)).length,0);
 const message=`同步成功：${folders.length} 个子文件夹，${records.length} 行 Excel，${matched} 个视频匹配（${excel.name}）`+(unmatched.length?`；${unmatched.length} 个文件夹未找到 A 列对应记录`:'');

function describeDownloadError(e,stage){
 let name='',message='';
 try{name=String(e?.name||'')}catch(_){}
 try{message=String(e?.message||'')}catch(_){}
 if(!message){try{message=String(e)}catch(_){message='浏览器返回空错误对象'}}

async function cacheFolder(){
 let f=current();if(!f)throw Error('先选择一个文件夹');if(state.downloading)return;
 canDownload();let files=vfiles(f);if(!files.length)throw Error('这个文件夹没有视频');
 if(!confirm('第一次确认：你确定现在连接的是 Wi-Fi，不是 4G/5G 吗？'))return;
 if(!confirm('第二次确认：请再次查看 Wi-Fi 图标，确认开始缓存「'+f.name+'」的视频吗？'))return;
 await auth();state.downloading=true;state.stop=false;
 const btn=$('#downloadAll'),stop=$('#stop'),clear=$('#clearFolder');if(btn)btn.disabled=true;if(stop)stop.disabled=false;if(clear)clear.disabled=true;
 let finished=0,skipped=0,failed=[],sameFailures=0,lastSignature='';
 try{
  for(const [i,file] of files.entries()){
   if(state.stop)break;
   if(netType()==='cellular'||!navigator.onLine){state.stop=true;throw Error('网络检测到蜂窝网络或离线，已停止')}
   let stage='检查本地缓存',abort=new AbortController();state.controller=abort;
   const p=$('#downloadProgress');if(p)p.textContent=`正在处理 ${i+1}/${files.length}：${file.name}`;
   try{
    let exist=await idbGet('videos',file.id);
    if(exist?.modifiedTime===file.modifiedTime){skipped++;continue}
    stage='检查本机空间';let quota=await navigator.storage?.estimate?.();
    if(quota?.quota&&file.size&&quota.quota-quota.usage<Number(file.size)*1.15)throw Error('本机可用空间可能不足');
    stage='Google Drive 下载请求';
    let res=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media',{signal:abort.signal});
    stage='读取视频响应';let blob=await res.blob();
    if(!blob.size)throw Error('视频响应为空');
    if(file.size&&blob.size!==Number(file.size))throw Error(`文件大小不一致：${bytes(blob.size)} / ${bytes(file.size)}`);
    stage='写入 iPhone 本地数据库';
    await idbPut('videos',{id:file.id,folderId:f.id,blob,name:file.name,size:blob.size,modifiedTime:file.modifiedTime});

   }catch(e){
    if(abort.signal.aborted||state.stop)break;
    let reason=describeDownloadError(e,stage);
    failed.push(file.name+' → '+reason);
    console.error('HOOPLOG download error', {file:file.name,stage,error:e,reason});
    let signature=stage+'|'+reason;

    if(sameFailures>=2){state.stop=true;break}

   }finally{state.controller=null}
  }

  await refreshLocal();

  toast(failed.length?'缓存失败：请查看详细原因':'缓存任务结束');
 }
}
async function clearFolder(){let f=current();if(!f||state.downloading)return;if(!confirm(`确定删除「${f.name}」这一天手机本地的所有视频缓存？Google Drive 的原文件不会删除。`))return;let all=await idbAll('videos');for(const v of all.filter(x=>x.folderId===f.id))await idbDelete('videos',v.id);await refreshLocal();toast('本机视频缓存已删除')}
async function play(id){let f=current();let v=f?.files.find(x=>x.id===id);if(!v)return;let cached=await idbGet('videos',id);if(!cached||cached.modifiedTime!==v.modifiedTime){toast('这个视频尚未缓存，请在 Wi-Fi 下先一键缓存');return}let r=fileRecord(f,v);if(state.playerUrl)URL.revokeObjectURL(state.playerUrl);state.playerUrl=URL.createObjectURL(cached.blob);let p=$('#videoPlayer');p.src=state.playerUrl;$('#videoTitle').textContent=v.name;$('#videoMeta').textContent=`${r?.action||'未分类'} · ${r?.result||'未记录结果'} · ${bytes(cached.size)}`;$('#videoNote').textContent=r?.note||'没有填写备注';$('#videoOverlay').classList.remove('hide');p.load();p.play().catch(()=>{});}

function parseCSV(t){let rows=[],r=[],v='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);if(r.some(Boolean))rows.push(r);r=[];v=''}else v+=c}r.push(v);if(r.some(Boolean))rows.push(r);return rows}
async function loadSheetJS(){if(window.XLSX)return;let urls=['https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];for(let src of urls){try{await new Promise((ok,bad)=>{let sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=bad;document.head.appendChild(sc)});if(window.XLSX)return}catch(e){}}throw Error('Excel 解析组件未能联网加载；可以先将表格另存为 CSV 后导入')}
function convertRows(rows,folder){let i=rows.findIndex(x=>{let text=(x||[]).slice(0,6).join(' ');return text.includes('日期')&&text.includes('动作类型')&&text.includes('结果')});if(i<0)throw Error('找不到“日期、动作类型、结果”表头');let hdr=rows[i].map(x=>String(x??'').trim());let col=t=>hdr.findIndex(x=>x.includes(t)),ai=col('日期'),bi=col('片段编号'),ci=col('动作类型'),di=col('结果'),ei=col('备注');if(bi<0)throw Error('没有找到“片段编号”列');let rs=rows.slice(i+1).map(x=>({date:dateText(x[ai]),clip:String(x[bi]??'').trim(),action:String(x[ci]??'').trim(),result:normResult(x[di]),note:String(x[ei]??'').trim()})).filter(x=>x.clip||x.action||x.note);let currentDate=folder?.date; if(currentDate){let matching=rs.filter(x=>x.date===currentDate);if(!matching.length&&rs.some(x=>x.date))throw Error('Excel 未找到与文件夹日期 '+currentDate+' 对应的行，请检查文件夹命名');rs=matching}return rs.filter(x=>x.clip)}
async function importExcelBlob(blob,name){let f=current();if(!f)throw Error('先选择一个子文件夹');let rows;if(/\.csv$/i.test(name))rows=parseCSV((await blob.text()).replace(/^\uFEFF/,''));else{await loadSheetJS();let wb=XLSX.read(await blob.arrayBuffer(),{type:'array',cellDates:false});let sheet=wb.SheetNames.find(x=>x.includes('小岩')&&!x.includes('汇总'))||wb.SheetNames[0];rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:'',raw:true})}let records=convertRows(rows,f);if(!records.length)throw Error('没有匹配当前日期的有效 Excel 记录');f.records=records;f.savedAt=Date.now();await idbPut('folders',{id:f.id,name:f.name,date:f.date,files:f.files,records,savedAt:f.savedAt});await refreshLocal();let match=vfiles(f).filter(x=>fileRecord(f,x)).length;toast(`已导入 ${records.length} 条记录；匹配 ${match} 个视频`);return {records:records.length,match}}
async function importDriveExcel(){let f=current();if(!f)throw Error('先选择文件夹');let arr=f.files.filter(x=>x.kind==='sheet').sort((a,b)=>(b.modifiedTime||'').localeCompare(a.modifiedTime||''));if(!arr.length)throw Error('该文件夹没有 Excel/CSV，请选择本地 Excel');await auth();let file=arr[0];let res=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media');return importExcelBlob(await res.blob(),file.name)}
async function refreshStorage(){let el=$('#storageInfo');if(!el)return;try{let e=await navigator.storage.estimate();let v=await idbAll('videos');let cache=v.reduce((s,x)=>s+Number(x.size||0),0);el.textContent=`视频实际保存 ${v.length} 个（约 ${bytes(cache)}）· 浏览器已使用 ${bytes(e.usage)} · 可用配额上限 ${bytes(e.quota)}（估计值）`}catch(err){el.textContent='浏览器无法提供存储使用量'}}
async function eventClick(e){let t=e.target.closest('button, label');if(!t)return;try{if(t.dataset.tab){setTab(t.dataset.tab);return}if(t.dataset.pick){state.folderId=t.dataset.pick;await updateCachedCounts();render();return}if(t.dataset.filter){state.filter=t.dataset.filter;render();return}if(t.dataset.play){await play(t.dataset.play);return}switch(t.id){case 'syncRoot':await syncRoot();break;case 'clearOldFolders':{if(!confirm('清理以前导入的文件夹记录和演示数据？不会删除已缓存的视频。清理后需要重新同步「篮球」。'))break;for(const f of await idbAll('folders'))await idbDelete('folders',f.id);state.folderId=null;await refreshLocal();toast('旧文件夹记录已清理，视频缓存未删除');break;}case 'downloadAll':await cacheFolder();break;case 'stop':state.stop=true;state.controller?.abort();toast('正在停止下载');break;case 'clearFolder':await clearFolder();break;case 'saveClient':{let val=$('#clientId').value.trim();if(val&&!/\.apps\.googleusercontent\.com$/.test(val))throw Error('客户端 ID 格式不正确');localStorage.setItem('hooplog_client_id',val);state.token=null;state.tokenExpiry=0;toast('客户端 ID 已保存');render();break}case 'googleLogin':{await auth();toast('Google 授权成功');render();break}case 'signout':{let tkn=state.token;state.token=null;state.tokenExpiry=0;if(tkn&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(tkn,()=>{});render();break}case 'refreshStorage':await refreshStorage();break;case 'closeVideo':closePlayer();break;}}catch(err){console.error('HOOPLOG operation failed',err);const message=err instanceof Error?err.message:(typeof err==='string'?err:(err&&typeof err.message==='string'?err.message:'操作失败（浏览器返回了空错误信息，请检查 Google 授权）'));toast(message);const p=$('#downloadProgress');if(p&&!state.downloading)p.textContent='操作未完成：'+message;const im=$('#importStatus');if(im)im.textContent='操作未完成：'+message}}
document.addEventListener('click',eventClick);document.addEventListener('change',async e=>{if(false && e.target.id==='excelInput'){let file=e.target.files?.[0];if(!file)return;try{let r=await importExcelBlob(file,file.name);let el=$('#importStatus');if(el)el.textContent=`Excel 成功：${r.records} 条记录，${r.match} 个视频匹配`}catch(err){toast(err?.message||'导入失败');let el=$('#importStatus');if(el)el.textContent=err?.message||'导入失败'}}});
window.addEventListener('online',()=>{setBadge()});window.addEventListener('offline',()=>{state.stop=true;state.controller?.abort();setBadge()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.downloading){state.stop=true;state.controller?.abort();toast('页面进入后台，下载已暂停')}});
(async()=>{try{db=await openDB();await refreshLocal();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW unavailable',e));}catch(e){console.error(e);$('#page').innerHTML='<div class="alert danger">当前浏览器无法使用本地视频数据库，请尝试从 Safari 打开 HTTPS 网站并关闭无痕模式。'+esc(e?.message||'未知错误')+'</div>'}})();
})();
